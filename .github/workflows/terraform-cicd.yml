
name: Terraform AWS Deployment using OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug OIDC Claims
        uses: github/actions-oidc-debugger@v1

      # Step 3: Configure AWS Credentials using OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::131292875621:role/GitHubActionsTerraformRole
          aws-region: us-east-1

      # Step 4: Verify AWS Authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 5: Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Step 6: Validate Terraform
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Terraform Plan
      - name: Terraform Plan
        run: terraform plan

      # Step 8: Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve
